[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nifilint"
version = "1.0.0"
description = "Lint Apache NiFi flow definitions for risky patterns"
requires-python = ">=3.10"

[project.scripts]
nifilint = "nifilint.__main__:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["nifilint"]

[tool.pytest.ini_options]
pythonpath = ["."]
