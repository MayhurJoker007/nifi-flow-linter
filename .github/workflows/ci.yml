name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[test]
      - run: pytest -v

  # The linter run on the example flow, published to the Security tab like a real project would use it
  lint-example-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - run: nifilint examples/*.json --format sarif > nifilint.sarif || true
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: nifilint.sarif
          category: nifilint
